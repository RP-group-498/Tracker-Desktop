<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>What were you doing?</title>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --surface-page: #f8fafc;
            --surface-glass: rgba(255, 255, 255, 0.88);
            --surface-glass-strong: rgba(255, 255, 255, 0.95);
            --surface-glass-soft: rgba(255, 255, 255, 0.65);
            --border-glass: rgba(148, 163, 184, 0.2);
            --border-glass-strong: rgba(99, 102, 241, 0.3);
            --text-primary: #0f172a;
            --text-muted: #64748b;
            --accent-primary: #6366f1;
            --accent-soft: #eef2ff;
            --radius-lg: 16px;
            --radius-md: 12px;
            --shadow-glass: 0 10px 25px rgba(99, 102, 241, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--surface-page);
            background-image: radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.05) 0px, transparent 50%),
                              radial-gradient(at 100% 100%, rgba(168, 85, 247, 0.05) 0px, transparent 50%);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            user-select: none;
            padding: 16px;
        }

        .header {
            text-align: center;
            margin-bottom: 12px;
            padding-top: 4px;
        }

        .header h1 {
            font-size: 1.35rem;
            font-weight: 800;
            color: var(--text-primary);
            letter-spacing: -0.025em;
            margin-bottom: 4px;
        }

        .header .idle-duration {
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-muted);
        }

        .header .idle-duration span {
            color: var(--accent-primary);
            font-weight: 800;
        }

        /* Legend */
        .legend {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-bottom: 16px;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .category-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .category-dot.academic { background: #10b981; box-shadow: 0 0 8px rgba(16, 185, 129, 0.3); }
        .category-dot.non_academic { background: #f43f5e; box-shadow: 0 0 8px rgba(244, 63, 94, 0.3); }
        .category-dot.neutral { background: #f59e0b; box-shadow: 0 0 8px rgba(245, 158, 11, 0.3); }

        .section-label {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-muted);
            margin-bottom: 8px;
            font-weight: 800;
            padding-left: 4px;
        }

        .activities-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 16px;
        }

        .activity-card {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 14px;
            background: var(--surface-glass);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(8px);
            box-shadow: var(--shadow-glass);
        }

        .activity-card:hover {
            border-color: var(--border-glass-strong);
            background: var(--surface-glass-strong);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.12);
        }

        .activity-card.selected {
            background: var(--accent-soft);
            border-color: var(--accent-primary);
            border-width: 1.5px;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.15);
        }

        .activity-card .icon-wrapper {
            color: var(--text-muted);
            transition: color 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .activity-card.selected .icon-wrapper {
            color: var(--accent-primary);
        }

        .activity-card .label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-primary);
            line-height: 1.25;
            flex: 1;
        }

        .activity-card .category-dot {
            margin-left: 2px;
        }

        .other-section {
            margin-bottom: 20px;
        }

        .other-input-wrapper input {
            width: 100%;
            padding: 12px 16px;
            background: var(--surface-glass);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            font-size: 0.9rem;
            font-weight: 500;
            outline: none;
            transition: all 0.2s;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.02);
        }

        .other-input-wrapper input:focus {
            border-color: var(--accent-primary);
            background: white;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1), inset 0 2px 4px rgba(0, 0, 0, 0.02);
        }

        .actions {
            display: flex;
            gap: 12px;
            margin-top: auto;
            padding-bottom: 4px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: var(--radius-md);
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-submit {
            background: linear-gradient(135deg, var(--accent-primary), #4f46e5);
            color: #fff;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        .btn-submit:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4);
        }

        .btn-submit:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn-skip {
            background: #f1f5f9;
            color: #64748b;
            border: 1px solid #e2e8f0;
        }

        .btn-skip:hover {
            background: #e2e8f0;
            color: #475569;
        }

        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
    </style>
</head>

<body>
    <div class="header">
        <h1>What were you doing?</h1>
        <div class="idle-duration">You were away for <span id="idle-time">—</span></div>
    </div>

    <div class="legend">
        <div class="legend-item"><span class="category-dot academic"></span> Academic</div>
        <div class="legend-item"><span class="category-dot non_academic"></span> Non-Academic</div>
        <div class="legend-item"><span class="category-dot neutral"></span> Neutral</div>
    </div>

    <div class="section-label">Choose an activity</div>
    <div class="activities-grid" id="activities-grid">
        <!-- Populated by JS -->
    </div>

    <div class="section-label" style="margin-top:4px;">Or describe it</div>
    <div class="other-section">
        <div class="other-input-wrapper">
            <input type="text" id="other-input" placeholder="e.g. Attending a meeting, phone call..." maxlength="100" />
        </div>
    </div>

    <div class="actions">
        <button class="btn btn-skip" id="btn-skip">Skip</button>
        <button class="btn btn-submit" id="btn-submit" disabled>Submit</button>
    </div>

    <script>
        // Predefined activities with Lucide icon names
        const ACTIVITIES = [
            { id: 'reading_book', icon: 'book-open', label: 'Reading a Book', category: 'academic' },
            { id: 'studying_notes', icon: 'file-text', label: 'Reviewing Notes', category: 'academic' },
            { id: 'attending_lecture', icon: 'graduation-cap', label: 'Lecture / Class', category: 'academic' },
            { id: 'research_library', icon: 'microscope', label: 'Research Work', category: 'academic' },
            { id: 'writing_notes', icon: 'pen-tool', label: 'Writing Notes', category: 'academic' },
            { id: 'break_relaxing', icon: 'coffee', label: 'Taking a Break', category: 'non_academic' },
            { id: 'exercise_walk', icon: 'activity', label: 'Exercise / Walk', category: 'non_academic' },
            { id: 'eating_meal', icon: 'utensils', label: 'Eating / Meal', category: 'non_academic' },
            { id: 'personal_errands', icon: 'home', label: 'Personal Errands', category: 'non_academic' },
            { id: 'social_conversation', icon: 'message-square', label: 'Socializing', category: 'non_academic' },
        ];

        let selectedActivityId = null;

        const params = new URLSearchParams(window.location.search);
        const idleDurationMs = parseInt(params.get('idleDurationMs') || '0', 10);
        const idleStart = params.get('idleStart') || '';
        const idleEnd = params.get('idleEnd') || '';

        function formatDuration(ms) {
            const totalSec = Math.floor(ms / 1000);
            const mins = Math.floor(totalSec / 60);
            const secs = totalSec % 60;
            if (mins >= 60) {
                const hrs = Math.floor(mins / 60);
                const remMins = mins % 60;
                return `${hrs}h ${remMins}m`;
            }
            if (mins > 0) return `${mins}m ${secs}s`;
            return `${secs}s`;
        }

        document.getElementById('idle-time').textContent = formatDuration(idleDurationMs);

        const grid = document.getElementById('activities-grid');
        ACTIVITIES.forEach(act => {
            const card = document.createElement('div');
            card.className = 'activity-card';
            card.dataset.id = act.id;
            card.innerHTML = `
                <div class="icon-wrapper">
                    <i data-lucide="${act.icon}" size="18"></i>
                </div>
                <span class="label">${act.label}</span>
                <span class="category-dot ${act.category}"></span>
            `;
            card.addEventListener('click', () => selectActivity(act.id, card));
            grid.appendChild(card);
        });

        // Initialize icons
        lucide.createIcons();

        const otherInput = document.getElementById('other-input');
        const submitBtn = document.getElementById('btn-submit');
        const skipBtn = document.getElementById('btn-skip');

        function selectActivity(id, cardEl) {
            document.querySelectorAll('.activity-card').forEach(c => c.classList.remove('selected'));
            cardEl.classList.add('selected');
            selectedActivityId = id;
            otherInput.value = '';
            submitBtn.disabled = false;
        }

        otherInput.addEventListener('input', () => {
            if (otherInput.value.trim()) {
                document.querySelectorAll('.activity-card').forEach(c => c.classList.remove('selected'));
                selectedActivityId = null;
                submitBtn.disabled = false;
            } else if (!selectedActivityId) {
                submitBtn.disabled = true;
            }
        });

        submitBtn.addEventListener('click', async () => {
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i data-lucide="loader-2" class="animate-spin" size="16"></i> Saving...';
            lucide.createIcons();

            const payload = {
                activityId: selectedActivityId,
                customLabel: otherInput.value.trim() || null,
                idleDurationMs: idleDurationMs,
                idleStart: idleStart,
                idleEnd: idleEnd,
            };

            try {
                if (window.electronAPI && window.electronAPI.submitIdleActivity) {
                    await window.electronAPI.submitIdleActivity(payload);
                }
            } catch (err) {
                console.error('Failed to submit idle activity:', err);
            }
            window.close();
        });

        skipBtn.addEventListener('click', async () => {
            skipBtn.disabled = true;
            skipBtn.textContent = 'Skipping...';

            const payload = {
                activityId: 'skipped',
                customLabel: null,
                idleDurationMs: idleDurationMs,
                idleStart: idleStart,
                idleEnd: idleEnd,
            };

            try {
                if (window.electronAPI && window.electronAPI.submitIdleActivity) {
                    await window.electronAPI.submitIdleActivity(payload);
                }
            } catch (err) {
                console.error('Failed to submit skipped idle activity:', err);
            }
            window.close();
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                skipBtn.click();
            } else if (e.key === 'Enter' && !submitBtn.disabled) {
                submitBtn.click();
            }
        });

        // Add CSS for spinner animation
        const style = document.createElement('style');
        style.innerHTML = `
            .animate-spin {
                animation: spin 1s linear infinite;
            }
            @keyframes spin {
                from { transform: rotate(0deg); }
                to { transform: rotate(360deg); }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>

</html>
